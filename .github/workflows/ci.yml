name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build and development dependencies
        run: |
          python -m pip install -r requirements/build.lock
          python -m pip install -r requirements/dev.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Test with coverage
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel and source distribution
        run: |
          python -m pip install -r requirements/build.lock
          python -m build

      - name: Verify installed package metadata
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import importlib.metadata, courtsim; assert importlib.metadata.version('courtsim') == courtsim.__version__"
          python -c "from pathlib import Path; import zipfile; wheel=next(Path('dist').glob('*.whl')); names=zipfile.ZipFile(wheel).namelist(); assert not any('/work/' in name or name.startswith('work/') for name in names)"
