name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static quality
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install -r requirements/dev.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Verify frozen long-test inputs
        run: python -m courtsim verify experiments/manifests/nba-v6-long-holdout-inputs-v1.json

  windows-fast:
    name: Quality (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install -r requirements/dev.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Test fast suite
        run: python -m pytest -q -m "not slow"

  coverage-fast:
    name: Coverage shard (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install -r requirements/dev.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Collect fast coverage
        run: python -m coverage run --parallel-mode -m pytest -q -m "not slow"

      - name: Upload fast coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fast
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  coverage-slow:
    name: Coverage shard (slow)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install -r requirements/dev.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Collect slow coverage
        run: python -m coverage run --parallel-mode -m pytest -q -m slow

      - name: Upload slow coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-slow
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  quality:
    name: Quality (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [static, coverage-fast, coverage-slow]
    timeout-minutes: 8

    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install coverage
        run: python -m pip install -r requirements/dev.lock

      - name: Download coverage shards
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true

      - name: Test with coverage
        run: |
          python -m coverage combine coverage-data
          python -m coverage report

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 10

    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel and source distribution
        run: |
          python -m pip install -r requirements/build.lock
          python -m build --no-isolation

      - name: Verify installed package metadata
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import importlib.metadata, courtsim; assert importlib.metadata.version('courtsim') == courtsim.__version__"
          python -c "from pathlib import Path; import zipfile; wheel=next(Path('dist').glob('*.whl')); names=zipfile.ZipFile(wheel).namelist(); assert not any('/work/' in name or name.startswith('work/') for name in names)"
