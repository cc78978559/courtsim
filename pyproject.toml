[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "courtsim"
version = "0.39.0"
description = "Offline-first foundation for a discrete-space basketball simulator"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "coverage>=7.10,<8",
  "hypothesis>=6.136,<7",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
courtsim = "courtsim.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["work", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
exclude = ["work", "outputs"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["courtsim"]
omit = ["src/courtsim/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
